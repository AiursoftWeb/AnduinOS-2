<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <title>AnduinOS Firefox Theme Fixture</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
    }
    body {
      align-items: center;
      background: rgb(248, 248, 248);
      color: rgb(18, 18, 18);
      display: flex;
      flex-direction: column;
      font: 700 56px sans-serif;
      justify-content: center;
    }
    #detail {
      font-size: 24px;
      margin-top: 32px;
    }
    @media (prefers-color-scheme: dark) {
      body {
        background: rgb(22, 22, 24);
        color: rgb(242, 242, 242);
      }
    }
  </style>
</head>
<body>
  <div id="state" role="status" aria-live="polite">UNINITIALIZED</div>
  <div id="detail">prefers-color-scheme behavioral oracle</div>
  <script>
    const query = window.matchMedia('(prefers-color-scheme: dark)');
    const render = () => {
      const state = query.matches ? 'DARK' : 'LIGHT';
      document.getElementById('state').textContent = `FIREFOX ${state}`;
      // Firefox exposes the active document title reliably through AT-SPI,
      // while some releases omit live-region text from the web content tree.
      // Keep the title equal to the behavior oracle so the test still reads a
      // value produced by this real matchMedia listener, not a browser pref.
      document.title = `FIREFOX ${state}`;
    };
    query.addEventListener('change', render);
    render();
  </script>
</body>
</html>
